---
ahoyapi: v2

commands:

  install:
    name: Install test dependencies.
    cmd: |
      [ -d ./tests/vendor ] && rm -rf ./tests/vendor
      composer --working-dir tests install
      [ -d ./tests/node_modules ] && rm -rf ./tests/node_modules
      yarn --cwd=tests install --frozen-lockfile
      [ -d ./tooling/node_modules ] && rm -rf ./tooling/node_modules
      yarn --cwd=tooling install --frozen-lockfile
      [ -d ./installer/vendor ] && rm -rf ./installer/vendor
      composer --working-dir installer install
      [ -d ./docs/node_modules ] && rm -rf ./docs/node_modules
      yarn --cwd=docs install --frozen-lockfile

  docs:
    name: Start documentation server.
    cmd: |
      [ ! -d ./docs/node_modules ] && yarn --cwd=docs install --frozen-lockfile
      yarn --cwd=docs run start

  docs-serve:
    name: Serve built documentation.
    cmd: |
      [ ! -d ./docs/node_modules ] && yarn --cwd=docs install --frozen-lockfile
      yarn --cwd=docs run start

  build-docs:
    name: Build documentation.
    cmd: |
      [ ! -d ./docs/node_modules ] && yarn --cwd=docs install --frozen-lockfile
      yarn --cwd=docs run build

  docs-combined:
    usage: Build the combined site serving both majors into the disposable 'docs_combined' directory.
    cmd: ./docs/.utils/assemble-combined-docs.sh

  docs-combined-serve:
    usage: Serve the built combined site on port 4000. Pass a port as the first argument to override.
    cmd: |
      [ -d ./docs_combined/build ] || { echo "No combined site found. Run 'ahoy docs-combined' first."; exit 1; }
      port="${1:-4000}"
      echo "Serving the combined documentation site at http://localhost:${port}"
      php -S "localhost:${port}" -t ./docs_combined/build ./docs/.utils/serve-router.php

  build-installer:
    name: Build documentation.
    cmd: |
      [ ! -d ./installer/vendor ] && composer --working-dir installer install
      composer --working-dir installer build

  lint:
    name: Lint Vortex project.
    cmd: |
      ahoy lint-installer
      ahoy lint-tests
      ahoy lint-scripts
      ahoy lint-dockerfiles
      ahoy lint-docs
      ahoy lint-markdown
      ahoy lint-ci

  lint-fix:
    name: Fix linting issues in Vortex project.
    cmd: |
      ahoy lint-installer-fix
      ahoy lint-tests-fix
      ahoy lint-docs-fix
      ahoy lint-markdown-fix
      ahoy lint-ci-fix

  lint-ci:
    cmd: ./tests/lint.ci.sh

  lint-ci-fix:
    cmd: ./tests/lint.ci.sh --fix

  lint-installer:
    cmd: composer --working-dir installer lint

  lint-installer-fix:
    cmd: composer --working-dir installer lint-fix

  lint-tests:
    cmd: composer --working-dir tests lint

  lint-tests-fix:
    cmd: composer --working-dir tests lint-fix

  lint-scripts:
    cmd: ./tests/lint.scripts.sh

  lint-dockerfiles:
    cmd: ./tests/lint.dockerfiles.sh

  lint-markdown:
    cmd: ./tests/lint.markdown.sh

  lint-markdown-fix:
    cmd: ./tests/lint.markdown.sh --fix

  lint-docs:
    cmd: |
      yarn --cwd=docs run lint
      yarn --cwd=./docs run spellcheck

  lint-docs-fix:
    cmd: yarn --cwd=docs run lint-fix

  test:
    name: Test Vortex project.
    cmd: |
      ahoy test-common
      ahoy test-docs

  test-bats:
    cmd: |
      [ ! -d tooling/node_modules ] && yarn --cwd=tooling install --frozen-lockfile
      tooling/node_modules/.bin/bats --no-tempdir-cleanup --tap "$@"

  test-common:
    cmd: ./tests/test.common.sh

  test-docs:
    cmd: |
      [ ! -d ./docs/node_modules ] && yarn --cwd=./docs install --frozen-lockfile
      yarn --cwd=./docs run test
      yarn --cwd=./docs run spellcheck

  # If there are changes to the snapshots - this command will re-run twice reporting error the first time.
  update-snapshots:
    aliases: [us]
    cmd: |
      export XDEBUG_MODE=off
      composer --working-dir=tests update-snapshots
      composer --working-dir=installer update-snapshots -- --jobs=8

  update-snapshots-install:
    aliases: [usi]
    cmd: |
      ahoy install
      ahoy update-snapshots

  update-docs:
    usage: Update the documentation.
    cmd: yarn --cwd=docs run update-variables

  update-videos:
    usage: Update documentation videos. Pass names to record a subset (installer, build, provision, lint, test, test-bdd, info, doctor, doctor-info); default is all of them. Pass --verify to re-render the committed artefacts and compare instead of recording.
    cmd: php docs/.utils/update-videos.php "$@"

entrypoint:
  - bash
  - "-c"
  - "-e"
  - bash -e -c "$0" "$@"
  - '{{cmd}}'
  - '{{name}}'
