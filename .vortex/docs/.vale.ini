StylesPath = .vale
MinAlertLevel = warning
Vocab = Vortex

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

# Blockquotes hold verbatim quotes from upstream projects.
SkippedScopes = script, style, pre, figure, blockquote

[*.mdx]
BasedOnStyles = Vale, Google, Vortex

# MDX 'import' statements are code, and JSX list items are fragments that
# would otherwise merge into 1 sentence.
BlockIgnores = (?m)^import\s[^;]*?from\s+'[^'\n]*';$, (?s)<li>.*?</li>

Vale.Spelling = NO

# Replaced by 'Vortex' rules of the same name.
Google.Acronyms = NO
Google.Contractions = NO
Google.Headings = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.WordList = NO
Google.WordListCase = NO

Google.Colons = NO
Google.FirstPerson = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Quotes = NO
Google.We = NO

write-good.ThereIs = YES

# The variables table is generated from script comments.
[content/development/variables.mdx]
BlockIgnores = (?m)^import\s[^;]*?from\s+'[^'\n]*';$, (?s)<li>.*?</li>, (?s)## Variables list.*
Vortex.BoldName = NO
