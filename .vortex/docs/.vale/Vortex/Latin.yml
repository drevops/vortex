extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/style/abbreviations'
level: error
ignorecase: true
nonword: true
action:
  name: replace
# The delimiter is a lookahead, so the replacement keeps the punctuation that
# follows the abbreviation.
swap:
  '\b(?:eg|e\.g\.)(?=[\s,;:)]|$)': for example
  '\b(?:ie|i\.e\.)(?=[\s,;:)]|$)': meaning|in other words
