extends: existence
message: "Add the Oxford comma before '%s'."
link: 'https://developers.google.com/style/commas'
scope: sentence
level: warning
nonword: true
# Only the conjunction is matched, and the list around it sits in lookarounds.
# Inline code reaches the rule masked with asterisks, and a match that holds
# masked text cannot be located in a hard-wrapped paragraph, so it is dropped.
#
# The guards after each comma skip text that opens a phrase, not a list item:
# a participle (', ensuring X and Y.'), a preposition (', without X or Y.'), an
# example (', for example, X and Y.') or an apposition ('2 profiles, X and Y.').
#
# '\s+' between words and the '\A' and '\z' anchors keep the match independent
# of where a paragraph is hard-wrapped.
tokens:
  # A list that ends the sentence: ', B and C.'
