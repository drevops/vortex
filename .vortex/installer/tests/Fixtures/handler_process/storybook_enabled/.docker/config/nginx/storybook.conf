# Storybook component library.
#
# Serves the static Storybook application and keeps the Drupal story render
# route reachable underneath the same path prefix.

# The Storybook module renders every story through Drupal.
location ^~ /storybook/stories/ {
  try_files $uri @drupal;
}

# A relative Location keeps the scheme and host the client used behind a
# TLS-terminating proxy.
location = /storybook {
  absolute_redirect off;
  return 301 /storybook/;
}

# Storybook builds the static application into the theme's 'storybook-static'
# directory. Its entry files keep their names across builds, so browsers
# revalidate them to pick up a rebuilt library.
location ^~ /storybook/ {
  alias /app/web/themes/custom/star_wars/storybook-static/;
  index index.html;
  expires -1;
}

# The Storybook development server runs on its own origin and loads theme
# fonts from this one.
location ~* ^/themes/custom/.+\.(woff2?|ttf|otf|eot)$ {
  add_header Access-Control-Allow-Origin '*' always;
  try_files $uri @drupal;
}
