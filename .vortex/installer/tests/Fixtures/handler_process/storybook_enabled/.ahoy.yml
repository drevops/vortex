+        url=\$(echo \"\${LOCALDEV_URL%%,*}\" | tr -d '[:space:]'); \
+        case \"\${url}\" in *://*) ;; *) url=\"http://\${url}\";; esac; \
+        SHELL=/bin/sh ${WEBROOT}/themes/custom/${DRUPAL_THEME}/node_modules/.bin/chokidar '${WEBROOT}/themes/custom/${DRUPAL_THEME}/components/**/*.stories.twig' -c 'vendor/bin/drush storybook:generate-all-stories --omit-server-url --force' & \
