# GitHub Actions configuration file.
#
# Security checks run in their own workflow so that a failing audit is
# distinguishable from a failing linter and can be re-run on its own.
name: Security audit

on:
  push:
    # Pushes to the following branches will trigger the workflow.
    branches:
      - production
      - main
      - master
      - develop
      - release/**
      - hotfix/**
      - project/**
    # Pushes of tags will also trigger the workflow.
    tags:
      - '*'
  # Pull requests to the following branches will trigger the workflow.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - production
      - main
      - master
      - develop
      - release/**
      - hotfix/**
      - feature/**
      - bugfix/**
      - project/**

  workflow_dispatch:

defaults:
  run:
    shell: bash

# Workaround for the Actions runner creating /root/.docker/config.json
# with permissions that prevent the container from reading it.
# https://github.com/actions/runner/issues/863
env:
  DOCKER_CONFIG: /tmp/.docker

permissions:
  contents: read

jobs:

  audit:
    runs-on: ubuntu-latest

    permissions:
      # The code scanning upload reads the workflow run in a private repository.
      actions: read
      contents: read
      security-events: write

    container:
      # https://hub.docker.com/r/drevops/ci-runner
      image: drevops/ci-runner:__VERSION__
      env:
        TZ: ${{ vars.TZ || 'UTC' }}
        TERM: xterm-256color
        VORTEX_DEBUG: ${{ vars.VORTEX_DEBUG }}

    steps:
      - name: Preserve $HOME set in the container
        run: echo HOME=/root >> "$GITHUB_ENV" # https://github.com/actions/runner/issues/863

      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          persist-credentials: false

      - name: Fix Git ownership permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Load environment variables from .env
        run: t=$(mktemp) && export -p >"${t}" && set -a && . ./.env && set +a && . "${t}" && env >> "$GITHUB_ENV"

      - name: Audit Composer packages
        if: ${{ !cancelled() }}
        run: composer audit --locked
        continue-on-error: ${{ vars.VORTEX_CI_COMPOSER_AUDIT_IGNORE_FAILURE == '1' }}

      - name: Audit npm packages
        if: ${{ !cancelled() }}
        run: npm audit --package-lock-only
        continue-on-error: ${{ vars.VORTEX_CI_NPM_AUDIT_IGNORE_FAILURE == '1' }}

      - name: Audit npm packages of the theme
        if: ${{ !cancelled() }}
        run: npm audit --package-lock-only --prefix="${WEBROOT}/themes/custom/${DRUPAL_THEME}"
        continue-on-error: ${{ vars.VORTEX_CI_NPM_AUDIT_IGNORE_FAILURE == '1' }}

      - name: Convert Composer audit findings to SARIF
        if: ${{ !cancelled() }}
        # Reporting must not decide the workflow result; the audit step above
        # is what fails on findings.
        continue-on-error: true
        run: |
          mkdir -p .artifacts/audit
          composer audit --locked --format=json > .artifacts/audit/composer-audit.json || true
          ./scripts/vortex-tooling.sh
          ./vendor/bin/vortex-convert-audit-sarif

      - name: Upload Composer audit findings to code scanning
        if: ${{ !cancelled() && hashFiles('.artifacts/audit/composer-audit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@__HASH__ # __VERSION__
        # The upload fails without a code scanning entitlement, and on fork
        # pull requests where the token is read-only. The audit step above is
        # what reports the findings and fails the workflow.
        continue-on-error: true
        with:
          sarif_file: .artifacts/audit/composer-audit.sarif
          category: composer-audit

      - name: Scan for committed secrets with Gitleaks
        if: ${{ !cancelled() }}
        # The runner host has no path matching the container's workspace, so a
        # bind mount of the working directory would scan nothing.
        # '--volumes-from' gives the scanner this container's own mounts.
        run: |
          mkdir -p .artifacts/audit
          docker run --rm --volumes-from "${HOSTNAME}" -w "${PWD}" ghcr.io/gitleaks/gitleaks:__VERSION__ dir . --no-banner --report-format sarif --report-path .artifacts/audit/gitleaks.sarif
        continue-on-error: ${{ vars.VORTEX_CI_GITLEAKS_IGNORE_FAILURE == '1' }}

      - name: Upload Gitleaks findings to code scanning
        if: ${{ !cancelled() && hashFiles('.artifacts/audit/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@__HASH__ # __VERSION__
        continue-on-error: true
        with:
          sarif_file: .artifacts/audit/gitleaks.sarif
          category: gitleaks

      - name: Upload security findings as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@__HASH__ # __VERSION__
        with:
          name: security-findings
          path: .artifacts/audit
          include-hidden-files: true
          if-no-files-found: ignore
