name: Draft release notes

on:
  push:
    tags:
      - '*'
    branches:
      - develop

permissions:
  contents: write

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          persist-credentials: false

      - name: Load environment variables from .env
        run: t=$(mktemp) && export -p >"${t}" && set -a && . ./.env && set +a && . "${t}" && env >> "$GITHUB_ENV"
        env:
          VORTEX_RELEASE_VERSION_SCHEME: ${{ vars.VORTEX_RELEASE_VERSION_SCHEME || 'calver' }}

      - name: Generate CalVer version
        if: ${{ contains(env.VORTEX_RELEASE_VERSION_SCHEME, 'calver') }}
        id: calver
        run: |
          export VERSION="$(date "+%y.%-m").0"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version set to ${VERSION}"

      # The previous release is the numerically highest of all releases, so
      # releases left behind by a superseded versioning scheme outrank the
      # current ones and both the resolved version and the change list are
      # then computed from the wrong release.
      - name: Resolve release version filter
        id: filter
        env:
          VORTEX_RELEASE_VERSION_FILTER_OVERRIDE: ${{ vars.VORTEX_RELEASE_VERSION_FILTER }}
        run: |
          RANGE="${VORTEX_RELEASE_VERSION_FILTER_OVERRIDE:-${VORTEX_RELEASE_VERSION_FILTER}}"
          if [ -z "${RANGE}" ]; then
            case "${VORTEX_RELEASE_VERSION_SCHEME}" in
              # CalVer years and SemVer majors share the number space, so 20
              # splits them: SemVer stays below it, CalVer short years from
              # 2020 onwards stay above it.
              *calver*) RANGE='>=__VERSION__' ;;
              *semver*) RANGE='<__VERSION__' ;;
              *) RANGE='*' ;;
            esac
          fi
          echo "range=${RANGE}" >> "${GITHUB_OUTPUT}"
          echo "Release version filter set to ${RANGE}"

      - name: Draft release notes
        uses: release-drafter/release-drafter@__HASH__ # __VERSION__
        with:
          tag: ${{ steps.calver.outputs.version }}
          name: ${{ steps.calver.outputs.version }}
          version: ${{ steps.calver.outputs.version }}
          filter-by-range: ${{ steps.filter.outputs.range }}
