# Maintenance page.
#
# Answers every request with HTTP status 503 and the static maintenance page
# while VORTEX_NGINX_MAINTENANCE_MODE is set to 1, so no request reaches PHP.
#
# The image entrypoint replaces the placeholder below with the variable's
# value when the container starts, so a changed value needs a new container.

set $vortex_maintenance "${VORTEX_NGINX_MAINTENANCE_MODE:-0}";

# nginx runs these directives again for the internal redirect to the error
# page, so the page URI is exempt.
if ($uri = /__maintenance.html) {
  set $vortex_maintenance 0;
}

if ($vortex_maintenance = 1) {
  return 503;
}

# A URI error page makes nginx serve the page as GET, so POST and other
# methods get the page instead of a 405 response.
error_page 503 /__maintenance.html;

location = /__maintenance.html {
  internal;
  alias /etc/nginx/html/maintenance.html;
}
