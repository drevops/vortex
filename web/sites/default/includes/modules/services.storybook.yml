# Storybook services.
#
# Loaded from `settings.storybook.php` in non-production environments only.
parameters:
  storybook.development: true
  # The Storybook development server runs on its own origin, so story renders
  # are shared with 'localhost' on any port. This replaces the 'cors.config'
  # from 'services.yml' in these environments.
  cors.config:
    enabled: true
    allowedHeaders: []
    allowedMethods: ['GET']
    allowedOrigins: []
    allowedOriginsPatterns: ['#^https?://(localhost|127\.0\.0\.1)(:\d+)?$#']
    exposedHeaders: false
    maxAge: false
    supportsCredentials: false
