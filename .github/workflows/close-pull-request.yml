##
# GitHub Actions workflow to action on Pull Request closure.
#

name: Close Pull Request

on:
  pull_request:
    types:
      - closed

jobs:
  remove_lagoon_environment:
    #;< VORTEX_DEV
    # The template repository has no Lagoon project and no webhook token.
    if: ${{ github.repository != 'drevops/vortex' }}
    #;> VORTEX_DEV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge ref of a pull request closed without merging may no
          # longer exist.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Install Vortex tooling
        run: ./scripts/vortex-tooling.sh

      - name: Remove environment after a PR is closed
        run: ./vendor/bin/vortex-remove-environment
        env:
          VORTEX_PLATFORM: lagoon
          VORTEX_REMOVE_ENVIRONMENT_LAGOON_WEBHOOK_ENDPOINT: ${{ vars.LAGOON_WEBHOOK_ENDPOINT }}
          VORTEX_REMOVE_ENVIRONMENT_LAGOON_WEBHOOK_TOKEN: ${{ secrets.LAGOON_WEBHOOK_TOKEN }}
