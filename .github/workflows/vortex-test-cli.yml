# This action is used for Vortex maintenance. It will not be used in the scaffolded project.
#
# Tests the 'drevops/vortex-cli' package that lives under '.vortex/cli'. The
# 'drevops/tui' dependency it builds on lives in its own repository and is
# installed from Packagist like any other package.
name: Vortex - Test CLI

on:
  push:
    branches:
      - main
      - release/**
      - project/**
      - '*.x'
  pull_request:
    branches:
      - main
      - feature/**
      - bugfix/**
      - release/**
      - project/**
      - '*.x'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vortex-test-cli:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Checkout the repository; no GITHUB_TOKEN writes are performed.

    env:
      GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.TEST_GITHUB_TOKEN }}"}}'

    strategy:
      matrix:
        php-versions: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Set default branch name
        run: git config --global init.defaultBranch >/dev/null || git config --global init.defaultBranch "main"

      - name: Install dependencies
        run: composer install
        working-directory: .vortex/cli

      - name: Validate Composer configuration is normalized
        run: composer normalize --dry-run
        working-directory: .vortex/cli

      - name: Check coding standards
        run: composer lint
        working-directory: .vortex/cli

      - name: Run tests
        run: composer test-coverage
        working-directory: .vortex/cli
        env:
          GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}

      - name: Upload coverage reports as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.php-versions }}
          path: .vortex/cli/.logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        continue-on-error: true
        with:
          files: .vortex/cli/.logs/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
