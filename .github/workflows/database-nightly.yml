# GitHub Actions workflow that refreshes the database every night.
#
# Fetches a fresh database from the source and caches it for the builds of the
# next day. Also pushes it to the database store and destinations when they
# are set. Run it manually to refresh the database on demand.
#
# The 'database' job is a copy of the 'database' job in build-test-deploy.yml
# with the refresh variables set. Keep their steps identical.
#;
#; Comments starting with '#;<' and '#;>' are internal Vortex comments
#; and will be removed during installation or update of Vortex.
name: Database nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Workaround for the Actions runner creating /root/.docker/config.json
# with permissions that prevent the container from reading it.
# https://github.com/actions/runner/issues/863
env:
  DOCKER_CONFIG: /tmp/.docker

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest

    container:
      # https://hub.docker.com/r/drevops/ci-runner
      image: drevops/ci-runner:26.11.0@sha256:555efdca6b8428f6223389ca4e116407de553a4240f09abbef78f4896c137129
      env:
        PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        VORTEX_CONTAINER_REGISTRY_USER: ${{ secrets.VORTEX_CONTAINER_REGISTRY_USER }}
        VORTEX_CONTAINER_REGISTRY_PASS: ${{ secrets.VORTEX_CONTAINER_REGISTRY_PASS }}
        TZ: ${{ vars.TZ || 'UTC' }}
        TERM: xterm-256color
        VORTEX_SSH_DISABLE_STRICT_HOST_KEY_CHECKING: "1"
        VORTEX_SSH_REMOVE_ALL_KEYS: "1"
        VORTEX_DEBUG: ${{ vars.VORTEX_DEBUG }}
        # How often to refresh the cache of the DB dump. Refer to `date` command.
        VORTEX_CI_DB_CACHE_TIMESTAMP: +%Y%m%d
        # Enforce fresh DB build (do not rely on fallback caches).
        VORTEX_CI_DB_CACHE_FALLBACK: "no"
        # Which branch to use as a source of DB caches.
        VORTEX_CI_DB_CACHE_BRANCH: "develop"
        # Do not build the Drupal front-end.
        VORTEX_FRONTEND_BUILD_SKIP: 1
        #;< DB_IN_IMAGE
        # Import the fetched database into a clean base image.
        VORTEX_DB_IMAGE_BASE: drevops/db-data-mysql-8.4:26.11.0
        # Deploy container image.
        VORTEX_EXPORT_DB_CONTAINER_REGISTRY_PUSH_PROCEED: 1
        #;> DB_IN_IMAGE
        # Push the sanitized database dump to the database store and destinations.
        VORTEX_PUSH_DB_PROCEED: 1
        #;< DB_FETCH_SOURCE_FTP
        VORTEX_FETCH_DB_FTP_USER: ${{ secrets.VORTEX_FETCH_DB_FTP_USER }}
        VORTEX_FETCH_DB_FTP_PASS: ${{ secrets.VORTEX_FETCH_DB_FTP_PASS }}
        #;> DB_FETCH_SOURCE_FTP
        #;< DB_FETCH_SOURCE_S3
        VORTEX_FETCH_DB_S3_ACCESS_KEY: ${{ secrets.VORTEX_FETCH_DB_S3_ACCESS_KEY }}
        VORTEX_FETCH_DB_S3_SECRET_KEY: ${{ secrets.VORTEX_FETCH_DB_S3_SECRET_KEY }}
        #;> DB_FETCH_SOURCE_S3
        #;< MIGRATION_DB_FETCH_SOURCE_FTP
        VORTEX_FETCH_DB2_FTP_USER: ${{ secrets.VORTEX_FETCH_DB2_FTP_USER }}
        VORTEX_FETCH_DB2_FTP_PASS: ${{ secrets.VORTEX_FETCH_DB2_FTP_PASS }}
        #;> MIGRATION_DB_FETCH_SOURCE_FTP
        #;< MIGRATION_DB_FETCH_SOURCE_S3
        VORTEX_FETCH_DB2_S3_ACCESS_KEY: ${{ secrets.VORTEX_FETCH_DB2_S3_ACCESS_KEY }}
        VORTEX_FETCH_DB2_S3_SECRET_KEY: ${{ secrets.VORTEX_FETCH_DB2_S3_SECRET_KEY }}
        #;> MIGRATION_DB_FETCH_SOURCE_S3
        #;< VORTEX_DEV
        # Push destinations of the demo databases on the nightly run. Empty
        # repository variables skip the push.
        VORTEX_PUSH_DB_DESTINATIONS: ${{ vars.VORTEX_PUSH_DB_DESTINATIONS }}
        VORTEX_PUSH_DB2_DESTINATIONS: ${{ vars.VORTEX_PUSH_DB2_DESTINATIONS }}
        # FTP server that receives both demo databases, in a directory that
        # tells this provider's dumps apart, with a timestamped copy of each
        # push.
        VORTEX_PUSH_DB_FTP_HOST: ${{ secrets.VORTEX_PUSH_DB_FTP_HOST }}
        VORTEX_PUSH_DB_FTP_PORT: ${{ secrets.VORTEX_PUSH_DB_FTP_PORT }}
        VORTEX_PUSH_DB_FTP_USER: ${{ secrets.VORTEX_PUSH_DB_FTP_USER }}
        VORTEX_PUSH_DB_FTP_PASS: ${{ secrets.VORTEX_PUSH_DB_FTP_PASS }}
        VORTEX_PUSH_DB_FTP_DIR: ${{ vars.VORTEX_PUSH_DB_FTP_DIR || 'gha' }}
        VORTEX_PUSH_DB_FTP_FILE: ${{ vars.VORTEX_PUSH_DB_FTP_FILE || 'db.sql' }}
        VORTEX_PUSH_DB_TIMESTAMPED_COPY: 1
        #;> VORTEX_DEV

    steps:
      # Frees disk space by removing preinstalled toolchains unused by this project. Steps run in a container, so the host is reached via the Docker socket.
      - name: Free up disk space on the runner
        if: ${{ vars.VORTEX_CI_FREE_DISK_SPACE == '1' }}
        run: |
          set -- /host/usr/local/.ghcup /host/usr/share/swift /host/usr/local/share/powershell /host/usr/share/dotnet /host/opt/hostedtoolcache/CodeQL
          # set -- "$@" /host/usr/local/lib/android # Removes about 10GB more, but takes about 50s. Uncomment to enable.
          job_image=$(docker inspect --format '{{.Config.Image}}' "${HOSTNAME}" 2>/dev/null || echo alpine:3)
          docker run --rm -v /:/host "${job_image}" rm -rf "$@" || true

      - name: Report disk usage
        run: df -h

      - name: Preserve $HOME set in the container
        run: echo HOME=/root >> "$GITHUB_ENV" # https://github.com/actions/runner/issues/863

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not keep SSH credentials after checkout to allow adding custom SSH keys.
          persist-credentials: false

      - name: Fix Git ownership permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add SSH private key used to fetch database
        if: ${{ env.VORTEX_FETCH_DB_SSH_PRIVATE_KEY != '' }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VORTEX_FETCH_DB_SSH_PRIVATE_KEY }}
          known_hosts: ${{ vars.VORTEX_FETCH_DB_SSH_KNOWN_HOSTS || 'unnecessary' }}
        env:
          VORTEX_FETCH_DB_SSH_PRIVATE_KEY: ${{ secrets.VORTEX_FETCH_DB_SSH_PRIVATE_KEY }}

      - name: Process the codebase to run in CI
        run: find . -name "docker-compose.yml" -print0 | xargs -0 -I {} sh -c "sed -i -e '/###/d' {} && sed -i -e 's/##//' {}"

      - name: Load environment variables from .env
        run: t=$(mktemp) && export -p >"${t}" && set -a && . ./.env && set +a && . "${t}" && env >> "$GITHUB_ENV"

      - name: Install Vortex tooling
        run: ./scripts/vortex-tooling.sh

      - name: Create cache keys files for database caching
        run: |
          echo "${VORTEX_CI_DB_CACHE_BRANCH}" | tee db_cache_branch
          echo "${VORTEX_CI_DB_CACHE_FALLBACK/no/"${GITHUB_RUN_NUMBER}"}" | tee db_cache_fallback
          date "${VORTEX_CI_DB_CACHE_TIMESTAMP}" | tee db_cache_timestamp
          echo "yes" | tee db_cache_fallback_yes

      # Restore DB cache based on the cache strategy set by the cache keys below.
      # Bump the last segment of the version prefix below to force a cache reset.
      # Lookup cache based on the default branch and a timestamp. Allows
      # to use cache from the very first build on the day (sanitized database dump, for example).
      - name: Restore DB cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .data
          key: v26.10.0-${{ hashFiles('db_cache_branch') }}-${{ hashFiles('db_cache_fallback') }}-${{ hashFiles('db_cache_timestamp') }}
          # Fallback to caching by default branch name only. Allows to use
          # cache from the branch build on the previous day.
          restore-keys: |
            v26.10.0-${{ hashFiles('db_cache_branch') }}-${{ hashFiles('db_cache_fallback') }}-

      - name: Fetch DB
        run: |
          VORTEX_FETCH_DB_SEMAPHORE=/tmp/fetch-db-fresh ./vendor/bin/vortex-fetch-db
          echo "db_hash=${{ hashFiles('.data') }}" >> "$GITHUB_ENV"
        timeout-minutes: 30
        #;< DB_FETCH_SOURCE_ACQUIA
        env:
          VORTEX_ACQUIA_KEY: ${{ secrets.VORTEX_ACQUIA_KEY }}
          VORTEX_ACQUIA_SECRET: ${{ secrets.VORTEX_ACQUIA_SECRET }}
        #;> DB_FETCH_SOURCE_ACQUIA

      #;< MIGRATION
      - name: Fetch migration DB
        run: VORTEX_DB_INDEX=2 ./vendor/bin/vortex-fetch-db
      #;> MIGRATION

      - name: Export DB
        run: |
          if [ ! -f /tmp/fetch-db-fresh ]; then echo "==> Database fetch semaphore file is missing. DB export will not proceed."; exit 0; fi
          #;< MIGRATION_DB_FETCH_SOURCE_CONTAINER_REGISTRY
          VORTEX_DB_INDEX=2 ./vendor/bin/vortex-refresh-db
          #;> MIGRATION_DB_FETCH_SOURCE_CONTAINER_REGISTRY
          ./vendor/bin/vortex-refresh-db
        timeout-minutes: 30

      #;< DB_FETCH_SOURCE_CONTAINER_REGISTRY
      # Deploy the freshly-exported database image to the container registry.
      # No-op unless a fresh DB was fetched (the fetch semaphore) and deployment
      # was requested (VORTEX_EXPORT_DB_CONTAINER_REGISTRY_PUSH_PROCEED, in the script).
      - name: Deploy DB image
        run: |
          #;< VORTEX_DEV
          if [ -z "${VORTEX_DB_IMAGE:-}" ]; then echo "==> Database-in-image storage is not used. DB image deployment will not proceed."; exit 0; fi
          #;> VORTEX_DEV
          if [ ! -f /tmp/fetch-db-fresh ]; then echo "==> No freshly fetched database. DB image deployment will not proceed."; exit 0; fi
          ./vendor/bin/vortex-push-db-image
        timeout-minutes: 30
      #;> DB_FETCH_SOURCE_CONTAINER_REGISTRY

      # Push the freshly-exported sanitized database dump to the push
      # destinations. No-op unless a fresh DB was fetched (the fetch semaphore) and
      # the push was requested (VORTEX_PUSH_DB_PROCEED, in the script).
      - name: Push DB
        run: |
          if [ ! -f /tmp/fetch-db-fresh ]; then echo "==> No freshly fetched database. DB push will not proceed."; exit 0; fi
          ./vendor/bin/vortex-push-db
        timeout-minutes: 30

      #;< MIGRATION
      # Push the freshly-fetched migration database dump to its push destinations,
      # next to the primary dump. No-op unless the push was requested.
      - name: Push migration DB
        run: |
          if [ ! -f /tmp/fetch-db-fresh ]; then echo "==> No freshly fetched database. DB push will not proceed."; exit 0; fi
          VORTEX_DB_INDEX=2 ./vendor/bin/vortex-push-db
        timeout-minutes: 30
      #;> MIGRATION

      # Save cache per default branch and the timestamp.
      # The cache will not be saved if it already exists.
      # Note that the cache fallback flag is enabled for this case in order
      # to save cache even if the fallback is not used when restoring it.
      - name: Save DB cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: env.db_hash != hashFiles('.data')
        with:
          path: .data
          key: v26.10.0-${{ hashFiles('db_cache_branch') }}-${{ hashFiles('db_cache_fallback_yes') }}-${{ hashFiles('db_cache_timestamp') }}
