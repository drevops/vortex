# This action is used for Vortex maintenance. It will not be used in the scaffolded project.
name: Vortex - Test docs

on:
  push:
    branches:
      - main
      - release/**
      - project/**
      - '*.x'
  pull_request:
    branches:
      - main
      - feature/**
      - bugfix/**
      - release/**
      - project/**
      - '*.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vortex-test-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Checkout the repository.
      pull-requests: write # Post the Netlify preview link comment on the PR.

    env:
      CURRENT_MAJOR: ${{ vars.VORTEX_CURRENT_MAJOR || '1' }}
      OTHER_MAJOR: ${{ (vars.VORTEX_CURRENT_MAJOR || '1') == '1' && '2' || '1' }}
      # Fork pull requests do not receive secrets, so they are not deployed.
      NETLIFY_DEPLOY: ${{ secrets.DOCS_NETLIFY_AUTH_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.17.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3

      # Each major ships its own binary: the installer on 1.x and the CLI on
      # 2.x, so the directory present identifies the major.
      - name: Build the binary
        run: |
          if [ -d .vortex/cli ]; then
            composer --working-dir=.vortex/cli install
            composer --working-dir=.vortex/cli build
            cp .vortex/cli/.build/vortex.phar .vortex/docs/static/install
            echo "DOCS_MAJOR=2" >> "$GITHUB_ENV"
          else
            composer --working-dir=.vortex/installer install
            composer --working-dir=.vortex/installer build
            cp .vortex/installer/build/installer.phar .vortex/docs/static/install
            echo "DOCS_MAJOR=1" >> "$GITHUB_ENV"
          fi
          php .vortex/docs/static/install --version
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Check docs up-to-date
        run: |
          yarn run update-variables
          git diff --quiet HEAD || { echo "Docs not up-to-date. Run 'cd .vortex && ahoy update-docs' and commit changes."; git diff; exit 1; }
        working-directory: '${{ github.workspace }}/.vortex/docs'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: '${{ github.workspace }}/.vortex/docs'

      - name: Lint code
        run: yarn run lint
        working-directory: '${{ github.workspace }}/.vortex/docs'

      - name: Run tests
        run: yarn run test:coverage
        working-directory: '${{ github.workspace }}/.vortex/docs'

      - name: Check spelling
        run: yarn run spellcheck
        working-directory: '${{ github.workspace }}/.vortex/docs'

      - name: Check prose style
        run: yarn run lint-prose
        working-directory: '${{ github.workspace }}/.vortex/docs'

      # On the main deploy, publish both majors to match the multi-version
      # docs: '/v1/install' and '/v2/install' are the stable per-major pins and
      # the bare '/install' is a copy of the current major's pin (the
      # 'VORTEX_CURRENT_MAJOR' repository variable, default 1). The binary
      # built above is the current major (built from 'main'); the other
      # major is built from its '{N}.x' branch. Mirrors 'vortex-release.yml'.
      - name: Checkout v${{ env.OTHER_MAJOR }} branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.OTHER_MAJOR }}.x
          path: vortex-v${{ env.OTHER_MAJOR }}
          persist-credentials: false

      # Each major builds whatever it ships - the installer here, the CLI on
      # '2.x' - so this leg keeps its own paths, box token and PHAR name.
      - name: Build and publish v${{ env.OTHER_MAJOR }} binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          case "${CURRENT_MAJOR}" in
            1|2) ;;
            *) echo "Invalid VORTEX_CURRENT_MAJOR='${CURRENT_MAJOR}'. Expected 1 or 2."; exit 1 ;;
          esac
          composer --working-dir="vortex-v${OTHER_MAJOR}/.vortex/cli" install
          sed -i "s/\"vortex-cli-version\": \"development\"/\"vortex-cli-version\": \"${OTHER_MAJOR}.x-dev\"/g" "vortex-v${OTHER_MAJOR}/.vortex/cli/box.json"
          composer --working-dir="vortex-v${OTHER_MAJOR}/.vortex/cli" build
          mkdir -p .vortex/docs/static/v1 .vortex/docs/static/v2
          cp .vortex/docs/static/install ".vortex/docs/static/v${CURRENT_MAJOR}/install"
          cp "vortex-v${OTHER_MAJOR}/.vortex/cli/.build/vortex.phar" ".vortex/docs/static/v${OTHER_MAJOR}/install"
          cp ".vortex/docs/static/v${CURRENT_MAJOR}/install" .vortex/docs/static/install
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      # Building the combined site is what checks links across both majors, so
      # every branch builds it. It runs after the binaries are staged, which the
      # assembly copies across with the rest of 'docs/'.
      - name: Build the combined documentation site
        run: ./docs/.utils/assemble-combined-docs.sh
        working-directory: '${{ github.workspace }}/.vortex'
        env:
          VORTEX_CURRENT_MAJOR: ${{ env.CURRENT_MAJOR }}
          VORTEX_DOCS_MAJOR: ${{ env.DOCS_MAJOR }}

      # A push to 'main' publishes to production; every other build publishes
      # an isolated draft preview. The next step posts the preview link.
      - name: Deploy to Netlify
        id: netlify
        if: env.NETLIFY_DEPLOY == 'true'
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        with:
          publish-dir: '.vortex/docs_combined/build'
          production-deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
        env:
          NETLIFY_SITE_ID: ${{ secrets.DOCS_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.DOCS_NETLIFY_AUTH_TOKEN }}
        timeout-minutes: 1

      - name: Post documentation preview link
        if: github.event_name == 'pull_request' && steps.netlify.outputs.deploy-url
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.pull_request.number }}
          header: docs-preview
          message: |
            📖 Documentation preview for this pull request has been deployed to Netlify:

            ${{ steps.netlify.outputs.deploy-url }}

            This preview is rebuilt on every commit and is not the production documentation site.

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-docs-coverage-report
          path: .vortex/docs/.logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: .vortex/docs/.logs/cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
