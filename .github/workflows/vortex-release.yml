# This action is used for Vortex maintenance. It will not be used in the scaffolded project.
name: Vortex - Release docs

on:
  push:
    tags:
      - '*'
    branches:
      - '**release-docs**'
      - '**release-installer**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty for auto-discovery)'
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  vortex-release-installer:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Checkout the repository; only builds and uploads the PHAR artifact.

    outputs:
      release-version: ${{ steps.version.outputs.value }}

    # The current major (built from this ref) and the other major (built from
    # its '{N}.x' branch) are both derived from 'VORTEX_CURRENT_MAJOR' (default
    # 1), so a single variable bump promotes a new major with no workflow edits.
    env:
      CURRENT_MAJOR: ${{ vars.VORTEX_CURRENT_MAJOR || '1' }}
      OTHER_MAJOR: ${{ (vars.VORTEX_CURRENT_MAJOR || '1') == '1' && '2' || '1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3

      - name: Install dependencies
        run: composer install
        working-directory: .vortex/installer

      - name: Set release version
        id: version
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            version="${INPUTS_VERSION}"
          else
            TAG=""
            SHA=""
            if [ "${REF_TYPE}" = "tag" ]; then TAG="${REF_NAME}"; fi
            if [ "${REF_TYPE}" = "branch" ]; then SHA="${REF_SHA}"; fi
            version="${TAG:-${SHA}}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
        working-directory: .vortex/installer
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_SHA: ${{ github.sha }}

      - name: Build PHAR
        run: |
          sed -i "s/\"vortex-installer-version\": \"development\"/\"vortex-installer-version\": \"${RELEASE_VERSION}\"/g" box.json
          composer build
        working-directory: .vortex/installer

      - name: Test PHAR
        run: |
          ./build/installer.phar --version
          ./build/installer.phar --no-interaction --no-cleanup --destination=test || exit 1
        working-directory: .vortex/installer

      - name: Upload v${{ env.CURRENT_MAJOR }} installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vortex-installer-v${{ env.CURRENT_MAJOR }}
          path: .vortex/installer/build/installer.phar
          if-no-files-found: error

      # Build the other major from its '{N}.x' branch so it is published
      # alongside the current one. Checked out into a separate path so the
      # build above is untouched. Mirrors how the docs job pulls the other
      # major's branch content. Each major builds whatever it ships - the
      # installer above, the CLI here - so this leg keeps its own paths.
      - name: Checkout v${{ env.OTHER_MAJOR }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.OTHER_MAJOR }}.x
          path: vortex-v${{ env.OTHER_MAJOR }}
          persist-credentials: false

      - name: Build v${{ env.OTHER_MAJOR }} binary
        run: |
          composer install
          sed -i "s/\"vortex-cli-version\": \"development\"/\"vortex-cli-version\": \"${OTHER_MAJOR}.x-dev\"/g" box.json
          composer build
          ./.build/vortex.phar --version
        working-directory: vortex-v${{ env.OTHER_MAJOR }}/.vortex/cli

      - name: Upload v${{ env.OTHER_MAJOR }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vortex-installer-v${{ env.OTHER_MAJOR }}
          path: vortex-v${{ env.OTHER_MAJOR }}/.vortex/cli/.build/vortex.phar
          if-no-files-found: error

  vortex-release-docs:
    needs: vortex-release-installer

    permissions:
      contents: read # Checkout the repository and build the documentation site.
      pages: write # Deploy the built site via 'actions/deploy-pages'.
      id-token: write # OIDC token required by 'actions/deploy-pages' to publish to GitHub Pages.

    environment:
      name: github-pages

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    env:
      CURRENT_MAJOR: ${{ vars.VORTEX_CURRENT_MAJOR || '1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version
        run: |
          version="${NEEDS_VORTEX_RELEASE_INSTALLER_OUTPUTS_RELEASE_VERSION}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"
        env:
          NEEDS_VORTEX_RELEASE_INSTALLER_OUTPUTS_RELEASE_VERSION: ${{ needs.vortex-release-installer.outputs.release-version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.17.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3

      - name: Download v1 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vortex-installer-v1
          path: installer-v1

      - name: Download v2 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vortex-installer-v2
          path: installer-v2

      # Publish both majors. '/v1/install' and '/v2/install' are the stable
      # per-major pins, always built from each major's own source. The bare
      # '/install' is a copy of the current major's pin, selected by the
      # 'VORTEX_CURRENT_MAJOR' repository variable (default 1) - bumping that one
      # variable is the only action needed to promote a new major.
      - name: Copy binaries to docs
        run: |
          case "${CURRENT_MAJOR}" in
            1|2) ;;
            *) echo "Invalid VORTEX_CURRENT_MAJOR='${CURRENT_MAJOR}'. Expected 1 or 2."; exit 1 ;;
          esac
          mkdir -p ../.vortex/docs/static/v1 ../.vortex/docs/static/v2
          # Each artifact holds exactly one PHAR, but its filename depends on
          # what that major ships, so it is matched rather than named.
          cp ../installer-v1/*.phar ../.vortex/docs/static/v1/install
          cp ../installer-v2/*.phar ../.vortex/docs/static/v2/install
          cp "../.vortex/docs/static/v${CURRENT_MAJOR}/install" ../.vortex/docs/static/install
          php ../.vortex/docs/static/install --version

      - name: Check docs up-to-date
        run: |
          yarn run update-variables
          git diff --quiet HEAD || { echo "Docs not up-to-date. Run 'cd .vortex && ahoy update-docs' and commit changes."; git diff; exit 1; }
        working-directory: .vortex/docs

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .vortex/docs

      # Production (GitHub Pages) serves the same aggregate site that
      # 'vortex-test-docs.yml' builds for development deploys and previews.
      - name: Assemble versioned docs
        run: ./.utils/assemble-versioned-docs.sh
        working-directory: .vortex/docs
        env:
          VORTEX_CURRENT_MAJOR: ${{ env.CURRENT_MAJOR }}

      - name: Build documentation site
        run: yarn run build
        working-directory: .vortex/docs
        env:
          VORTEX_CURRENT_MAJOR: ${{ env.CURRENT_MAJOR }}

      - name: Generate video for installer (not used in the final artifact)
        env:
          ASCIINEMA_VERSION: v3.2.1
          ASCIINEMA_SHA256: 1b405bbda565b33c3c4718de67fedc3535580603c0694b1ff3fb04f363430a20
        run: |
          sudo apt-get update
          sudo apt install expect
          sudo curl -sSL "https://github.com/asciinema/asciinema/releases/download/${ASCIINEMA_VERSION}/asciinema-x86_64-unknown-linux-gnu" -o /usr/local/bin/asciinema
          echo "${ASCIINEMA_SHA256}  /usr/local/bin/asciinema" | sha256sum --check --strict
          sudo chmod +x /usr/local/bin/asciinema
          yarn install --frozen-lockfile
          php .utils/update-videos.php installer
        working-directory: .vortex/docs

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .vortex/docs/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
